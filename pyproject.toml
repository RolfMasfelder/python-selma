[project]
name = "python-selma"
version = "1.0.1"
description = "Selma agent gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "selmakit",
    "colorama>=0.4.6",
    "openai>=2.29.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "pytest>=9.0.3",
    "rich>=14.3.3",
    "streamlit>=1.55.0",
]

[tool.uv.sources]
selmakit = { path = "../python-selmakit", editable = true }
