[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selma"
version = "1.0.1"
description = "Selma agent gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arize-phoenix",
    "colorama>=0.4.6",
    "ddgs",
    "fastapi",
    "httpx",
    "openai>=2.29.0",
    "openinference-instrumentation",
    "openinference-instrumentation-openai",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-sdk",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-telegram-bot",
    "rich>=14.3.3",
    "streamlit>=1.55.0",
    "trafilatura",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pre-commit>=4.0.0",
    "ruff>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long-standing style in this codebase; not worth a mass line-splitting diff right now.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests call tracing setup() before other imports on purpose (must run first).
"tests/*" = ["E402"]
