[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selma"
# 0.2.0 (2026-10-20): Paket wird installierbar (Console-Scripts
# selma-gateway / -setup / -dashboard, [project.scripts]). Parallel-Projekte
# nutzen von hier an einen ECHTEN venv + `pip install ~/workspace/selma`
# (selma_venv_setup.sh) statt venv-Symlink + src/-Symlink — Versions-Pinning
# statt "MAIN-Quellen direkt im Projekt".
version = "0.2.0"
description = "Selma agent gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arize-phoenix",
    "colorama>=0.4.6",
    "ddgs",
    "fastapi",
    "httpx",
    "openai>=2.29.0",
    "openinference-instrumentation",
    "openinference-instrumentation-openai",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-sdk",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-telegram-bot",
    "rich>=14.3.3",
    "streamlit>=1.55.0",
    "trafilatura",
    "uvicorn[standard]",
]

# Console-Skripte: beim `pip install selma` erzeugen diese Einträge CLI-Befehle
# im venv. Damit läuft selma überall über die INSTALLIERTE Version statt über
# einen lokalen src/-Symlink — Parallel-Projekte pinnen so eine Version.
[project.scripts]
selma-gateway = "selma.gateway:main"
selma-setup = "selma.setup:main"
selma-dashboard = "selma.dashboard_cli:main"

[project.optional-dependencies]
dev = [
    "bandit>=1.9.0",
    "mypy>=2.0.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "vulture>=2.15.0",
]
audio = [
    # Lokale Audio-Tools (tts_speak / stt_transcribe in selma/audio_tool.py).
    # Optional: ohne diese Dependencies fehlen die Tools einfach,
    # der Rest von selma läuft.
    "piper-tts>=1.8.0",
    "faster-whisper>=1.2.1",
    "onnxruntime>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long-standing style in this codebase; not worth a mass line-splitting diff right now.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests call tracing setup() before other imports on purpose (must run first).
"tests/*" = ["E402"]
